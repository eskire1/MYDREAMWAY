[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-v5-global"
version = "1.0.0"
description = "Apex V5 Global – модульная торговая система для алгоритмической торговли криптовалютами"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["crypto", "trading", "machine-learning", "lstm", "catboost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.0",
    "torch==2.2.0",
    "pytorch-lightning==2.1.3",
    "catboost==1.2.3",
    "scikit-learn>=1.3.0",
    "pyyaml==6.0.1",
    "h5py==3.10.0",
    "pyarrow==15.0.0",
    "fastparquet==2024.2.0",
    "python-dotenv==1.0.1",
    "tqdm==4.66.1",
    "click==8.1.7",
    "colorama==0.4.6",
    "websocket-client==1.7.0",
    "requests==2.31.0",
    "ta==0.11.0",
    "loguru==0.7.2",
    "nicegui>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "ccxt>=4.2.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.0.0",
]

[project.scripts]
apex-live = "src.main:main"   # если в main.py будет определена функция main()
apex-backtest = "scripts.run_backtest:main"
apex-ui = "src.ui.app:main"

[tool.setuptools]
packages = ["src", "src.agents", "src.data", "src.execution", "src.backtest", "src.runtime", "src.ui", "src.utils", "scripts"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.env.example"]
